  if (e.type === 'container') {
    const g = s('g', {class:'sect' + (e.href ? ' link' : '')}, gSect);
    if (e.href) g.setAttribute('data-href', e.href);
    const rc = s('rect', {x:e.x, y:e.y, width:e.w, height:e.h, rx:12}, g);
    const t = s('text', {x:e.x + 4, y:e.y - 10}, g); t.textContent = e.text;
    if (e.href) { const m = document.createElementNS(NS, 'tspan'); m.setAttribute('class', 'lk'); m.textContent = ' \u2197'; t.appendChild(m); }
    box[e.id] = {x:e.x, y:e.y, w:e.w, h:e.h, sect:true, rect:rc};
  } else if (e.type === 'shape') {
    const g = s('g', {class:'shape' + (e.color === 'pink' ? ' pink' : '') + (e.stroke ? ' s-' + e.stroke : '') + (e.href ? ' link' : '')}, gTop);
    if (e.href) g.setAttribute('data-href', e.href);
    s('rect', {x:e.x, y:e.y, width:e.w, height:e.h, rx:10}, g);
    const [fo, d] = html(g, e.x, e.y, e.w, e.h, 'fo sz-' + (e.size || 'body') + (e.textAlign === 'left' ? ' left' : ''));
    d.style.height = 'auto'; d.style.minHeight = '100%';
    for (const line of e.text.split('\n')) { const p = document.createElementNS(XH, 'p'); inline(p, line); d.appendChild(p); }
    const mark = e.href ? s('text', {x:e.x + e.w - 7, y:e.y + 15, 'text-anchor':'end', class:'lk'}, g) : null;
    if (mark) mark.textContent = '\u2197';
    box[e.id] = {x:e.x, y:e.y, w:e.w, h:e.h, shape:true, g, rect:g.firstChild, fo, d, mark};
  } else if (e.type === 'text') {
    const w = e.wrap || 2000;
    const [fo, d] = html(gTop, e.x, e.y, w, 600, 'txt sz-' + (e.size || 'body'));
    for (const line of e.text.split('\n')) { const p = document.createElementNS(XH, 'p'); p.style.margin = '0'; inline(p, line); d.appendChild(p); }
    if (e.href) { const m = document.createElementNS(XH, 'span'); m.className = 'lkh'; m.textContent = '\u2197'; d.firstChild.appendChild(m); }
    if (e.href) { fo.setAttribute('data-href', e.href); fo.setAttribute('class', 'link'); }
    box[e.id] = {x:e.x, y:e.y, w, h:0, fo, d};
  } else if (e.type === 'table') {
    const w = e.cols.reduce((a, b) => a + b, 0);
    const [fo, d] = html(gTop, e.x, e.y, w, 1000, 'tbl');
    const t = document.createElementNS(XH, 'table'); t.style.width = w + 'px';
    e.rows.forEach((r, i) => {
      const tr = document.createElementNS(XH, 'tr');
      r.forEach((c, j) => { const td = document.createElementNS(XH, 'td'); td.style.width = e.cols[j] + 'px'; td.textContent = c; if ((e.pink || []).some(([a, b]) => a === i && b === j)) td.className = 'pink'; tr.appendChild(td); });
      t.appendChild(tr);
    });
    if (e.href) { const m = document.createElementNS(XH, 'span'); m.className = 'lkh'; m.textContent = '\u2197'; t.rows[0].cells[t.rows[0].cells.length - 1].appendChild(m); }
    d.appendChild(t);
    if (e.href) { fo.setAttribute('data-href', e.href); fo.setAttribute('class', 'link'); }
    box[e.id] = {x:e.x, y:e.y, w, h:0, fo, d, tbl:t};
  }
}

function setY(b, y, h) { b.y = y; b.h = h; b.rect.setAttribute('y', y); b.rect.setAttribute('height', h); b.fo.setAttribute('y', y); b.fo.setAttribute('height', h); if (b.mark) b.mark.setAttribute('y', y + 15); }
function settle() {
  for (const id in box) {
    const b = box[id];
    if (b.fo && !b.shape) { const h = Math.ceil((b.tbl || b.d).offsetHeight); if (h > 0) { b.h = h; b.fo.setAttribute('height', h + 2); } }
  }
  for (const id in box) { const b = box[id]; if (b.shape) { const need = Math.ceil(b.d.scrollHeight); if (need > b.h) setY(b, b.y, need); } }
  for (const cid in box) {
    const c = box[cid]; if (!c.sect) continue;
    const kids = Object.values(box).filter(b => b.shape && b.x >= c.x && b.x + b.w <= c.x + c.w && b.y >= c.y && b.y < c.y + c.h).sort((a, b) => a.y - b.y);
    const cur = {}; let low = -1e9;
    for (const b of kids) { const k = b.x; const y = Math.max(b.y, cur[k] ?? -1e9); if (y !== b.y) setY(b, y, b.h); cur[k] = b.y + b.h + 10; low = Math.max(low, cur[k]); }
    if (kids.length && low + 14 > c.y + c.h) { c.h = low + 14 - c.y; c.rect.setAttribute('height', c.h); }
  }
  let bottom = -1e9;
  for (const cid in box) { const c = box[cid]; if (c.sect && c.y > 0) bottom = Math.max(bottom, c.y + c.h); }
  for (const id in box) { const b = box[id]; if (b.shape && b.y >= 800 && b.y < bottom + 20) setY(b, bottom + 20, b.h); }
}
function pt(b, side) {
  if (side === 'top') return [b.x + b.w / 2, b.y];
  if (side === 'bottom') return [b.x + b.w / 2, b.y + b.h];
  if (side === 'left') return [b.x, b.y + b.h / 2];
  return [b.x + b.w, b.y + b.h / 2];
}
const V = s => s === 'top' || s === 'bottom';
function arrows() {
  gArr.innerHTML = '';
  for (const e of EL) {
    if (e.type !== 'arrow') continue;
    const [x1, y1] = pt(box[e.from], e.fromSide), [x2, y2] = pt(box[e.to], e.toSide);
    let d, lx, ly;
    if (V(e.fromSide) && V(e.toSide)) { const my = (y1 + y2) / 2; d = Math.abs(x1 - x2) < 1 ? `M${x1} ${y1}V${y2}` : `M${x1} ${y1}V${my}H${x2}V${y2}`; lx = (x1 + x2) / 2; ly = my - 8; }
    else if (!V(e.fromSide) && !V(e.toSide)) { const mx = (x1 + x2) / 2; d = Math.abs(y1 - y2) < 1 ? `M${x1} ${y1}H${x2}` : `M${x1} ${y1}H${mx}V${y2}H${x2}`; lx = mx; ly = Math.min(y1, y2) - 8; }
    else if (!V(e.fromSide)) { d = `M${x1} ${y1}H${x2}V${y2}`; lx = (x1 + x2) / 2; ly = y1 - 10; }
    else { d = `M${x1} ${y1}V${y2}H${x2}`; lx = (x1 + x2) / 2; ly = y2 - 10; }
    s('path', {d, class:'arr' + (e.dash ? ' dash' : ''), 'marker-end':'url(#ah)'}, gArr);
    if (e.label) { const t = s('text', {x:lx, y:ly, 'text-anchor':'middle', class:'alab'}, gArr); t.textContent = e.label; }
  }
}

let vb = {x:0, y:0, w:1000, h:800};
function apply() { svg.setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
function scale() { const r = svg.getBoundingClientRect(); return r.width / vb.w || 1; }
function bounds() {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const id in box) { const b = box[id]; x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y - 40); x1 = Math.max(x1, b.x + b.w); y1 = Math.max(y1, b.y + b.h); }
  return {x0, y0, x1, y1};
}
function fit() {
  const B = bounds(), r = svg.getBoundingClientRect(), pad = 40;
  const w = B.x1 - B.x0 + 2 * pad, h = B.y1 - B.y0 + 2 * pad;
  const k = Math.max(w / r.width, h / r.height);
  vb = {w:r.width * k, h:r.height * k, x:0, y:0};
  vb.x = B.x0 - pad - (vb.w - w) / 2; vb.y = B.y0 - pad - (vb.h - h) / 2; apply();
}
function zoom(f, cx, cy) {
  const r = svg.getBoundingClientRect();
  if (cx === undefined) { cx = r.left + r.width / 2; cy = r.top + r.height / 2; }
  const px = vb.x + (cx - r.left) / r.width * vb.w, py = vb.y + (cy - r.top) / r.height * vb.h;
  vb.w *= f; vb.h *= f; vb.x = px - (cx - r.left) / r.width * vb.w; vb.y = py - (cy - r.top) / r.height * vb.h; apply();
}
svg.addEventListener('wheel', ev => { ev.preventDefault(); zoom(Math.exp(ev.deltaY * 0.0015), ev.clientX, ev.clientY); }, {passive:false});
let drag = null;
svg.addEventListener('pointerdown', ev => { drag = {x:ev.clientX, y:ev.clientY, vx:vb.x, vy:vb.y, moved:false}; svg.setPointerCapture(ev.pointerId); svg.classList.add('drag'); });
svg.addEventListener('pointermove', ev => { if (!drag) return; if (Math.abs(ev.clientX - drag.x) + Math.abs(ev.clientY - drag.y) > 5) drag.moved = true; const k = vb.w / svg.getBoundingClientRect().width; vb.x = drag.vx - (ev.clientX - drag.x) * k; vb.y = drag.vy - (ev.clientY - drag.y) * k; apply(); });
svg.addEventListener('pointerup', ev => {
  const click = drag && !drag.moved; drag = null; svg.classList.remove('drag');
  if (!click) return;
  const hit = document.elementFromPoint(ev.clientX, ev.clientY);
  const a = hit && hit.closest('[data-href]');
  if (a) window.location.href = a.getAttribute('data-href');
});
const tip = document.getElementById('tip');
svg.addEventListener('pointermove', ev => {
  if (drag || ev.pointerType === 'touch') { tip.style.display = 'none'; return; }
  const a = ev.target.closest && ev.target.closest('[data-href]');
  if (!a) { tip.style.display = 'none'; return; }
  tip.textContent = tipText(a.getAttribute('data-href'));
  tip.style.display = 'block';
  const x = Math.min(ev.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + 'px'; tip.style.top = (ev.clientY + 16) + 'px';
});
svg.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
document.getElementById('zin').onclick = () => zoom(0.8);
document.getElementById('zout').onclick = () => zoom(1.25);
document.getElementById('zfit').onclick = fit;
window.addEventListener('resize', fit);

vb = {x:-760, y:-860, w:2900, h:1820}; apply();
requestAnimationFrame(() => { settle(); arrows(); fit(); });
</script>
